spring:
  application:
    name: yu-ai-agent
  profiles:
    active: local
  ai:
    mcp:
      client:
        request-timeout: 60s
#        sse:
#          connections:
#            server1:
#                url: http://localhost:8127
        stdio:
          servers-configuration: classpath:mcp-servers.json
chat-memory:
  storage-path: ./chat-memory
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
